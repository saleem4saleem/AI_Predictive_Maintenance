services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: predictive-maintenance-backend
    environment:
      ENVIRONMENT: development
      API_PREFIX: /api/v1
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@database:5432/predictive_maintenance
      MODEL_DIR: backend/saved_models
      OPENAI_API_KEY: ""
      LLM_PROVIDER: none
      ENABLE_LLM: "false"
      USE_MOCK_DATA: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8501
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: timescale/timescaledb:latest-pg16
    container_name: predictive-maintenance-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: predictive_maintenance
    ports:
      - "5432:5432"
    volumes:
      - predictive_maintenance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d predictive_maintenance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  predictive_maintenance_pgdata:
